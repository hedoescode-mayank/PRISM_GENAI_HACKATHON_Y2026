[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samsung-guided-troubleshooting"
version = "0.1.0"
description = "Source-backed Samsung Smart Guided Troubleshooting Engine"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[project.scripts]
samsung-engine = "samsung_engine.api:main"
samsung-doctor = "samsung_engine.doctor:main"
samsung-benchmark = "samsung_engine.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
